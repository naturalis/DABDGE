<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C7079"/></marker><marker id="arrowamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#C2711C"/></marker></defs><rect width="1240" height="700" fill="#FFFFFF"/><text x="40" y="52" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="24" fill="#17262E" font-weight="600" text-anchor="start" font-style="normal" letter-spacing="0">The data life cycle</text><text x="40" y="78" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#5C7079" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">Analysis is the visible part and the shortest. The decisions that make reuse possible are taken before any data exist.</text><path d="M 655.0 223.9 A 175 175 0 0 1 716.3 259.3" fill="none" stroke="#5C7079" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M 771.4 354.6 A 175 175 0 0 1 771.4 425.4" fill="none" stroke="#5C7079" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M 716.3 520.7 A 175 175 0 0 1 655.0 556.1" fill="none" stroke="#5C7079" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M 545.0 556.1 A 175 175 0 0 1 483.7 520.7" fill="none" stroke="#5C7079" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M 428.6 425.4 A 175 175 0 0 1 428.6 354.6" fill="none" stroke="#5C7079" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M 483.7 259.3 A 175 175 0 0 1 545.0 223.9" fill="none" stroke="#5C7079" stroke-width="1.3" marker-end="url(#arrow)"/><circle cx="600.0" cy="215.0" r="27" fill="#F2F6F7" stroke="#2E7D4F" stroke-width="2"/><text x="600.0" y="221.0" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" fill="#2E7D4F" font-weight="600" text-anchor="middle" font-style="normal" letter-spacing="0">1</text><text x="600.0" y="127.0" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" fill="#2E7D4F" font-weight="600" text-anchor="middle" font-style="normal" letter-spacing="0">Plan</text><text x="600.0" y="149.0" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5C7079" font-weight="400" text-anchor="middle" font-style="normal" letter-spacing="0">what will be measured,</text><text x="600.0" y="167.0" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5C7079" font-weight="400" text-anchor="middle" font-style="normal" letter-spacing="0">and what travels with it</text><circle cx="751.6" cy="302.5" r="27" fill="#F2F6F7" stroke="#2E7D4F" stroke-width="2"/><text x="751.5544456622767" y="308.5" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" fill="#2E7D4F" font-weight="600" text-anchor="middle" font-style="normal" letter-spacing="0">2</text><text x="797.5544456622767" y="294.5" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" fill="#2E7D4F" font-weight="600" text-anchor="start" font-style="normal" letter-spacing="0">Collect</text><text x="797.5544456622767" y="316.5" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5C7079" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">specimens, reads,</text><text x="797.5544456622767" y="334.5" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5C7079" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">images, sensor streams</text><circle cx="751.6" cy="477.5" r="27" fill="#F2F6F7" stroke="#2A7568" stroke-width="2"/><text x="751.5544456622767" y="483.5" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" fill="#2A7568" font-weight="600" text-anchor="middle" font-style="normal" letter-spacing="0">3</text><text x="797.5544456622767" y="469.5" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" fill="#2A7568" font-weight="600" text-anchor="start" font-style="normal" letter-spacing="0">Process</text><text x="797.5544456622767" y="491.5" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5C7079" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">cleaning and filtering;</text><text x="797.5544456622767" y="509.5" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5C7079" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">each step is a claim</text><circle cx="600.0" cy="565.0" r="27" fill="#F2F6F7" stroke="#246F85" stroke-width="2"/><text x="600.0" y="571.0" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" fill="#246F85" font-weight="600" text-anchor="middle" font-style="normal" letter-spacing="0">4</text><text x="600.0" y="619.0" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" fill="#246F85" font-weight="600" text-anchor="middle" font-style="normal" letter-spacing="0">Analyse</text><text x="600.0" y="641.0" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5C7079" font-weight="400" text-anchor="middle" font-style="normal" letter-spacing="0">the visible part,</text><text x="600.0" y="659.0" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5C7079" font-weight="400" text-anchor="middle" font-style="normal" letter-spacing="0">and the shortest</text><circle cx="448.4" cy="477.5" r="27" fill="#F2F6F7" stroke="#1B6E93" stroke-width="2"/><text x="448.44555433772325" y="483.50000000000006" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" fill="#1B6E93" font-weight="600" text-anchor="middle" font-style="normal" letter-spacing="0">5</text><text x="402.44555433772325" y="469.50000000000006" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" fill="#1B6E93" font-weight="600" text-anchor="end" font-style="normal" letter-spacing="0">Preserve</text><text x="402.44555433772325" y="491.50000000000006" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5C7079" font-weight="400" text-anchor="end" font-style="normal" letter-spacing="0">deposit, with</text><text x="402.44555433772325" y="509.50000000000006" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5C7079" font-weight="400" text-anchor="end" font-style="normal" letter-spacing="0">identifiers</text><circle cx="448.4" cy="302.5" r="27" fill="#F2F6F7" stroke="#1B6E93" stroke-width="2"/><text x="448.44555433772325" y="308.5" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" fill="#1B6E93" font-weight="600" text-anchor="middle" font-style="normal" letter-spacing="0">6</text><text x="402.44555433772325" y="294.5" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" fill="#1B6E93" font-weight="600" text-anchor="end" font-style="normal" letter-spacing="0">Reuse</text><text x="402.44555433772325" y="316.5" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5C7079" font-weight="400" text-anchor="end" font-style="normal" letter-spacing="0">by you in six months, by</text><text x="402.44555433772325" y="334.5" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5C7079" font-weight="400" text-anchor="end" font-style="normal" letter-spacing="0">someone else in ten years</text><text x="600" y="382" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#5C7079" font-weight="400" text-anchor="middle" font-style="normal" letter-spacing="0">every dataset</text><text x="600" y="404" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#5C7079" font-weight="400" text-anchor="middle" font-style="normal" letter-spacing="0">you will meet</text><rect x="40" y="560" width="330" height="112" rx="2" fill="none" stroke="#C2711C" stroke-width="1.5"/><text x="60" y="592" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#C2711C" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">Metadata that was never recorded</text><text x="60" y="614" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#C2711C" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">at step 1 cannot be recovered at</text><text x="60" y="636" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#C2711C" font-weight="600" text-anchor="start" font-style="normal" letter-spacing="0">step 6.</text></svg>