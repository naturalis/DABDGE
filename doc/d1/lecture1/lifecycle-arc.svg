<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 400" width="1240" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C7079"/></marker><marker id="arrowamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#C2711C"/></marker><linearGradient id="arc" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2E7D4F"/><stop offset="100%" stop-color="#1B6E93"/></linearGradient></defs><rect width="1240" height="400" fill="#FFFFFF"/><text x="40" y="52" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="24" fill="#17262E" font-weight="600" text-anchor="start" font-style="normal" letter-spacing="0">Four weeks, one arc</text><text x="40" y="78" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#5C7079" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">Each week opens a different part of the life of a dataset.</text><rect x="40.0" y="116" width="276.5" height="196" rx="2" fill="none" stroke="#C3D0D6" stroke-width="1.2"/><rect x="40.0" y="116" width="276.5" height="5" fill="#2E7D4F"/><text x="58.0" y="154" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5C7079" font-weight="600" text-anchor="start" font-style="normal" letter-spacing="0">Week 1</text><text x="58.0" y="182" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" fill="#17262E" font-weight="600" text-anchor="start" font-style="normal" letter-spacing="0">Generation and</text><text x="58.0" y="204" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Aria