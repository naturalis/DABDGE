on</text><text x="941.5" y="228" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#1B6E93" font-weight="600" text-anchor="start" font-style="normal" letter-spacing="0">Filipe</text><text x="941.5" y="256" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5C7079" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">How does this come</text><text x="941.5" y="274" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5C7079" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">together in a real</text><text x="941.5" y="292" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5C7079" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">biodiversity question?</text><text x="40" y="354" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#C2711C" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">You are here. Last week the records were made; next week they are computed on. This week we open them.</text></svg>