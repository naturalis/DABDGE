ll="#17262E" font-weight="600" text-anchor="start" font-style="normal" letter-spacing="0">FAIR</text><text x="352.5" y="228" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#256B70" font-weight="600" text-anchor="start" font-style="normal" letter-spacing="0">Rutger</text><text x="352.5" y="256" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5C7079" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">How is a record</text><text x="352.5" y="274" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5C7079" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">structured, made</text><text x="352.5" y="292" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5C7079" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">interoperable, and used?</text><line x1="614.0" y1="214.0" x2="625.0" y2="214.0" stroke="#5C7079" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="629.0" y="116" width="276.5" height="196" rx="2" fill="none" stroke="#C3D0D6" stroke-width="1.2"/><rect x="629.0" y="116" width="276.5" height="5" fill="#20718A"/><text x="647.0" y="154" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5C7079" font-weight="600" text-anchor="start" font-style="normal" letter-spacing="0">Week 3</text><text x="647.0" y="182" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" fill="#17262E" font-weight="600" text-anchor="start" font-style="normal" letter-spacing="0">Analysis and</text><text x="647.0" y="204" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" fill="#17262E" font-weight="600" text-anchor="start" 