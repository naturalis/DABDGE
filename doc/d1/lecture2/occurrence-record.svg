DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#1B6E93" font-weight="600" text-anchor="start" font-style="normal" letter-spacing="0">who</text><rect x="900" y="118" width="300" height="150" rx="2" fill="none" stroke="#C2711C" stroke-width="1.5"/><text x="918" y="148" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#C2711C" font-weight="600" text-anchor="start" font-style="normal" letter-spacing="0">The field everyone omits</text><text x="918" y="174" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5C7079" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">Six decimal places of latitude</text><text x="918" y="193" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5C7079" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">and no stated uncertainty. The</text><text x="918" y="212" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5C7079" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">record looks precise to a metre</text><text x="918" y="231" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5C7079" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">and may be accurate to a</text><text x="918" y="250" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5C7079" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">province.</text><rect x="900" y="292" width="300" height="174" rx="2" fill="#F2F6F7" stroke="#C3D0D6" stroke-width="1.2"/><text x="918" y="322" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#1B6E93" font-weight="600" text-anchor="start" font-style="normal" letter-spacing="0">Ask first</text><text x="918" y="350" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5C7079" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">What is each row one of?</text><text x="918" y="369" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5C7079" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">What evidence stands behind it?</text><text x="918" y="388" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5C7079" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">How well is 'where' known?</text><text x="918" y="407" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5C7079" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">Who made the determination,</text><text x="918" y="426" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5C7079" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">and when?</text><text x="918" y="445" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5C7079" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">What can it be joined to?</text><text x="40" y="540" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#C2711C" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">Aggregation across thousands of publishers is possible only because they all use these names. That is the whole argument for vocabularies.</text></svg>