<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" width="1240" height="600" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C7079"/></marker><marker id="arrowamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#C2711C"/></marker></defs><rect width="1240" height="600" fill="#FFFFFF"/><text x="40" y="52" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="24" fill="#17262E" font-weight="600" text-anchor="start" font-style="normal" letter-spacing="0">Anatomy of an occurrence record</text><text x="40" y="78" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#5C7079" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">One assertion: this taxon was here, at this time, and somebody says so. Darwin Core gives every part of it an agreed name.</text><rect x="40" y="118" width="700" height="356" rx="2" fill="#F2F6F7" stroke="#C3D0D6" stroke-width="1.2"/><text x="60" y="152" font-family="IBM Plex Mono, DejaVu Sans Mono, Menlo, monospace" font-size="13.5" fill="#5C7079" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">occurrenceID</text><text x="340" y="152" font-family="IBM Plex Mono, DejaVu Sans Mono, Menlo, monospace" font-size="13.5" fill="#17262E" font-weight="600" text-anchor="start" font-style="normal" letter-spacing="0">URN:catalog:UMB:MOL:88412</text><text x="60" y="186" font-family="IBM Plex Mono, DejaVu Sans Mono, Menlo, monospace" font-size="13.5" fill="#5C7079" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">basisOfRecord</text><text x="340" y="186" font-family="IBM Plex Mono, Dej