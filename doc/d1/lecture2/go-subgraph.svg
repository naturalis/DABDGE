<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" width="1240" height="620" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C7079"/></marker><marker id="arrowamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#C2711C"/></marker></defs><rect width="1240" height="620" fill="#FFFFFF"/><text x="40" y="52" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="24" fill="#17262E" font-weight="600" text-anchor="start" font-style="normal" letter-spacing="0">The Gene Ontology is a graph, not a list</text><text x="40" y="78" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#5C7079" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">Terms have stable identifiers, written definitions, and explicit relations to each other. Annotation is inherited upwards.</text><rect x="380" y="118" width="300" height="64" rx="2" fill="#FFFFFF" stroke="#C3D0D6" stroke-width="1.2"/><rect x="380" y="118" width="4" height="64" fill="#2A7568"/><text x="394" y="142" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#17262E" font-weight="600" text-anchor="start" font-style="normal" letter-spacing="0">developmental process</text><text x="394" y="159" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#17262E" font-weight="600" text-anchor="start" font-style="normal" letter-spacing="0">involved in reproduction</text><text x="394" y="175" font-family="IBM Plex Mono, DejaVu Sans Mono, Menlo, monospace" font-size="11.5" fill="#5C7079" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">GO:0003006</text><rect x="40" y="272" width="190" height="64" rx="2" fill="#FFFFFF" stroke="#C3D0D6" stroke-width="1.2"/><rect x="40" y="272" width="4" height="64" fill="#2E7D4F"/><text x="54" y="296" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#17262E" font-weight="600" text-anchor="start" font-style="normal" letter-spacing="0">floral whorl</text><text x="54" y="313" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#17262E" font-weight="600" text-anchor="start" font-style="normal" letter-spacing="0">development</text><text x="54" y="329" font-family="IBM Plex Mono, DejaVu Sans Mono, Menlo, monospace" font-size="11.5" fill="#5C7079" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">GO:0048438</text><path d="M 530.0 182 C 530.0 232, 135.0 228, 135.0 272" fill="none" stroke="#5C7079" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="250" y="272" width="190" height="64" rx="2" fill="#FFFFFF" stroke="#C3D0D6" stroke-width="1.2"/><rect x="250" y="272" width="4" height="64" fill="#2E7D4F"/><text x="264" y="296" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#17262E" font-weight="600" text-anchor="start" font-style="normal" letter-spacing="0">seed maturation</text><text x="264" y="329" font-family="IBM Plex Mono, DejaVu Sans Mono, Menlo, monospace" font-size="11.5" fill="#5C7079" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">GO:0010431</text><path d="M 530.0 182 C 530.0 232, 345.0 228, 345.0 272" fill="none" stroke="#5C7079" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="460" y="272" width="300" height="64" rx="2" fill="#F2F6F7" stroke="#C2711C" stroke-width="2"/><rect x="460" y="272" width="4" height="64" fill="#C2711C"/><text x="474" y="296" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#C2711C" font-weight="600" text-anchor="start" font-style="normal" letter-spacing="0">vegetative to reproductive</text><text x="474" y="313" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#C2711C" font-weight="600" text-anchor="start" font-style="normal" letter-spacing="0">phase transition of meristem</text><text x="474" y="329" font-family="IBM Plex Mono, DejaVu Sans Mono, Menlo, monospace" font-size="11.5" fill="#5C7079" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">GO:0010228</text><path d="M 530.0 182 C 530.0 232, 610.0 228, 610.0 272" fill="none" stroke="#C2711C" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="790" y="272" width="190" height="64" rx="2" fill="#FFFFFF" stroke="#C3D0D6" stroke-width="1.2"/><rect x="790" y="272" width="4" height="64" fill="#2E7D4F"/><text x="804" y="296" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#17262E" font-weight="600" text-anchor="start" font-style="normal" letter-spacing="0">flower morphogenesis</text><text x="804" y="329" font-family="IBM Plex Mono, DejaVu Sans Mono, Menlo, monospace" font-size="11.5" fill="#5C7079" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">GO:0048439</text><path d="M 530.0 182 C 530.0 232, 885.0 228, 885.0 272" fill="none" stroke="#5C7079" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="40" y="410" width="190" height="64" rx="2" fill="#FFFFFF" stroke="#C3D0D6" stroke-width="1.2"/><rect x="40" y="410" width="4" height="64" fill="#2E7D4F"/><text x="54" y="434" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#17262E" font-weight="600" text-anchor="start" font-style="normal" letter-spacing="0">corolla development</text><text x="54" y="467" font-family="IBM Plex Mono, DejaVu Sans Mono, Menlo, monospace" font-size="11.5" fill="#5C7079" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">GO:0048465</text><path d="M 135 336 C 135 380, 135 382, 135 410" fill="none" stroke="#5C7079" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="250" y="410" width="190" height="64" rx="2" fill="#FFFFFF" stroke="#C3D0D6" stroke-width="1.2"/><rect x="250" y="410" width="4" height="64" fill="#2E7D4F"/><text x="264" y="434" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#17262E" font-weight="600" text-anchor="start" font-style="normal" letter-spacing="0">petal development</text><text x="264" y="467" font-family="IBM Plex Mono, DejaVu Sans Mono, Menlo, monospace" font-size="11.5" fill="#5C7079" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">GO:0048441</text><path d="M 135 336 C 135 380, 345 382, 345 410" fill="none" stroke="#5C7079" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="830" y="372" width="370" height="191" rx="2" fill="#F2F6F7" stroke="#C3D0D6" stroke-width="1.2"/><text x="850" y="402" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#1B6E93" font-weight="600" text-anchor="start" font-style="normal" letter-spacing="0">Two consequences</text><text x="850" y="430" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5C7079" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">A gene annotated to a term is implicitly</text><text x="850" y="449" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5C7079" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">annotated to every ancestor of that term.</text><text x="850" y="468" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5C7079" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">So terms at different depths are not</text><text x="850" y="487" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5C7079" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">independent evidence in an enrichment test.</text><text x="850" y="506" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5C7079" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0"></text><text x="850" y="525" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#C2711C" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">Every annotation carries an evidence code.</text><text x="850" y="544" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#C2711C" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">One without it is a rumour.</text><text x="40" y="578" font-family="IBM Plex Sans, Source Sans Pro, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5C7079" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">Edges are typed relations (is_a, part_of, regulates). Traversing and pruning a subgraph is a graph operation, not a keyword lookup.</text></svg>